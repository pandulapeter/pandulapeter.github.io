<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Pandula Péter</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query
      // string into just a query string, and then redirects the browser
      // to the new url with only a query string and hash fragment.
      // Note: this 404.html file must be at least 512 bytes for it to work
      // with Internet Explorer (it is currently > 512 bytes)

      // Subfolders that host a Compose Multiplatform app using URL subpaths.
      // Each of these must have an index.html containing the matching decoder script.
      var allowedSubpaths = ["kubriko", "deepcut-vinyl"];
      var l = window.location;
      var segments = l.pathname.split("/").filter(Boolean);
      var firstPathSegment = segments[0];
      if (allowedSubpaths.indexOf(firstPathSegment) !== -1) {
        // The apps only have one level of routing, so any deeper path is collapsed
        // into a single segment. This keeps the relative asset paths of the app working.
        var route = segments.slice(1).join("");
        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            '/' + firstPathSegment + '/?/' + route +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
      } else {
        l.replace("/");
      }
    </script>
  </head>
  <body>
  </body>
</html>
