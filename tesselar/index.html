<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tesselar</title>
    <link type="text/css" rel="stylesheet" href="styles.css">
    <link rel="preload" href="50387f6c919363ec18a4.wasm" as="fetch" crossorigin>
    <link rel="preload" href="bfa5198fb2fe683c613a.wasm" as="fetch" crossorigin>
</head>
<body>
<div class="loadingScreen">
    <div class="loadingTrack"><div class="loadingBar indeterminate"></div></div>
    <div class="loadingStatus">Loading…</div>
</div>
<script>
    // Runs before web.js so every WebAssembly fetch it makes goes through this wrapper. The production build
    // fills in the expected byte count (and preload links in the head) for the .wasm files; a dev-server build
    // leaves the placeholder as is, and then Content-Length is used when the server sends one.
    (function () {
        var expectedBytes = 12832995;
        var bar = document.querySelector('.loadingBar');
        var status = document.querySelector('.loadingStatus');
        var receivedBytes = 0;
        var announcedBytes = 0;
        var openStreams = 0;

        var render = function () {
            var totalBytes = expectedBytes || announcedBytes;
            if (totalBytes === 0) {
                return;
            }
            var ratio = Math.min(receivedBytes / totalBytes, 1);
            bar.classList.remove('indeterminate');
            bar.style.width = (ratio * 100) + '%';
            var isDownloaded = expectedBytes ? receivedBytes >= expectedBytes : openStreams === 0;
            status.textContent = isDownloaded ? 'Starting…' : 'Downloading… ' + Math.floor(ratio * 100) + '%';
        };

        var fail = function () {
            bar.classList.remove('indeterminate');
            bar.style.width = '0';
            status.textContent = 'Tesselar could not start. Please try again in an up-to-date browser.';
        };
        window.addEventListener('error', fail);
        window.addEventListener('unhandledrejection', fail);

        var isWasmRequest = function (input) {
            var url = typeof input === 'string' ? input : input instanceof Request ? input.url : String(input);
            return /\.wasm(\?.*)?$/.test(url);
        };

        var originalFetch = window.fetch;
        window.fetch = function (input) {
            var promise = originalFetch.apply(this, arguments);
            if (!isWasmRequest(input)) {
                return promise;
            }
            return promise.then(function (response) {
                if (!response.ok || !response.body) {
                    return response;
                }
                announcedBytes += Number(response.headers.get('content-length')) || 0;
                openStreams++;
                // The bytes are counted on a copy, and the loader is handed the response the browser fetched:
                // only that one carries the compiled code Chrome caches for a .wasm file it has seen before, so a
                // response rebuilt around a counting stream would have both modules compiled again on every load.
                var reader = response.clone().body.getReader();
                var count = function () {
                    reader.read().then(function (result) {
                        if (result.done) {
                            openStreams--;
                        } else {
                            receivedBytes += result.value.byteLength;
                            count();
                        }
                        render();
                    }, function () {
                        openStreams--;
                        render();
                    });
                };
                count();
                return response;
            });
        };
    })();
</script>
<script type="application/javascript" src="web.js"></script>
</body>
</html>
