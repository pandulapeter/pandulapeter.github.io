<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0f0f0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="DeepCut Vinyl cuts custom vinyl records in real time on a Vinylrecorder T-560 lathe. Personalized tracks, custom labels, jackets and sleeves, made in Cluj-Napoca, Romania.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="DeepCut Vinyl">
    <meta property="og:title" content="DeepCut Vinyl">
    <meta property="og:description" content="Your music, your message — cut on record. Custom vinyl records, labels, jackets and sleeves.">
    <meta property="og:url" content="https://www.deepcutvinyl.com/">
    <meta property="og:image" content="https://www.deepcutvinyl.com/metadata/logo.png">
    <meta name="twitter:card" content="summary">
    <title>DeepCut Vinyl</title>
    <link rel="icon" type="image/svg+xml" href="metadata/favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="metadata/favicon-96x96.png">
    <link rel="shortcut icon" href="metadata/favicon.ico">
    <!-- The two font files are the only resources the app waits for, so start them in parallel with the wasm. -->
    <link rel="preload" as="fetch" crossorigin="anonymous" href="composeResources/deepcutvinyl.app.generated.resources/font/header.ttf">
    <link rel="preload" as="fetch" crossorigin="anonymous" href="composeResources/deepcutvinyl.app.generated.resources/font/content.ttf">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #0f0f0f;
        }
        #app {
            position: absolute;
            inset: 0;
            z-index: 10;
        }
        #loadingScreen {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            background: #0f0f0f;
            transition: opacity 0.45s ease, visibility 0s linear 0.45s;
            user-select: none;
            -webkit-user-select: none;
        }
        #loadingScreen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        #loadingScreen img {
            width: min(180px, 44vw);
            height: auto;
        }
        #loadingScreen .spinner {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2.5px solid rgba(173, 146, 240, 0.2);
            border-top-color: #ad92f0;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        noscript {
            position: absolute;
            inset: 0;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #0f0f0f;
            color: #fff;
            font-family: system-ui, sans-serif;
            text-align: center;
        }
    </style>
    <script type="text/javascript">
        // The app builds its routes ("/faqs") and loads its runtime config ("/home-banner.json")
        // with root-absolute paths, which escape the folder when the site is not served from the
        // domain root. Re-add the folder prefix so history entries and requests stay inside it.
        // At the domain root the prefix is empty and this whole block is a no-op.
        (function() {
          var prefix = window.location.pathname.replace(/[^/]*$/, '').replace(/\/$/, '');
          if (!prefix) return;

          // Same-origin only, given either as "/path" or as the full "https://host/path".
          // Relative, protocol-relative and cross-origin URLs are left untouched.
          var origin = window.location.origin;
          function prefixed(url) {
            if (typeof url !== 'string') return url;
            var head = '';
            if (url.indexOf(origin + '/') === 0) {
              head = origin;
              url = url.slice(origin.length);
            } else if (url.charAt(0) !== '/' || url.charAt(1) === '/') {
              return head + url;
            }
            if (url !== prefix && url.indexOf(prefix + '/') !== 0) url = prefix + url;
            return head + url;
          }

          ['pushState', 'replaceState'].forEach(function(name) {
            var original = window.history[name];
            window.history[name] = function(state, title, url) {
              return original.call(window.history, state, title, prefixed(url));
            };
          });

          var originalFetch = window.fetch;
          window.fetch = function(input, init) {
            return originalFetch.call(window, prefixed(input), init);
          };

          var originalOpen = window.XMLHttpRequest.prototype.open;
          window.XMLHttpRequest.prototype.open = function(method, url) {
            arguments[1] = prefixed(url);
            return originalOpen.apply(this, arguments);
          };
        }())
    </script>
    <script type="text/javascript">
        // Single Page Apps for GitHub Pages
        // MIT License
        // https://github.com/rafgraph/spa-github-pages
        // Converts the redirect query string produced by 404.html back into a real path.
        (function(l) {
          if (l.search[1] === '/' ) {
            var decoded = l.search.slice(1).split('&').map(function(s) {
              return s.replace(/~and~/g, '&')
            }).join('?');
            window.history.replaceState(null, null,
                l.pathname.slice(0, -1) + decoded + l.hash
            );
          }
        }(window.location))
    </script>
</head>
<body>
    <div id="app"></div>
    <div id="loadingScreen" aria-busy="true" aria-label="Loading">
        <img src="composeResources/deepcutvinyl.app.generated.resources/drawable/img_logo.webp" alt="DeepCut Vinyl" width="720" height="403">
        <div class="spinner"></div>
    </div>
    <noscript>DeepCut Vinyl needs JavaScript enabled. Write to contact@deepcutvinyl.com or call +40 740 755 264.</noscript>
    <script type="application/javascript" src="app.js"></script>
</body>
</html>
