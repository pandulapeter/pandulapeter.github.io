    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #0f0f0f;
        }
        #app {
            position: absolute;
            inset: 0;
            z-index: 10;
            touch-action: none;
        }
        #loadingScreen {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            background: #0f0f0f;
            transition: opacity 0.45s ease, visibility 0s linear 0.45s;
            user-select: none;
            -webkit-user-select: none;
        }
        #loadingScreen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        #loadingScreen img {
            width: min(180px, 44vw);
            height: auto;
        }
        #loadingProgress {
            position: relative;
            width: min(180px, 44vw);
            height: 3px;
            border-radius: 999px;
            overflow: hidden;
            background: rgba(173, 146, 240, 0.2);
        }
        #loadingProgressFill {
            width: 0;
            height: 100%;
            border-radius: 999px;
            background: #ad92f0;
            transform-origin: left center;
            transition: width 0.25s ease-out;
        }
        /* Used when the download size is unknown, so the bar still shows that work is happening. */
        #loadingProgress.indeterminate #loadingProgressFill {
            width: 40%;
            transition: none;
            animation: slide 1.1s ease-in-out infinite;
        }
        @keyframes slide {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(250%); }
        }
        @media (prefers-reduced-motion: reduce) {
            #loadingProgress.indeterminate #loadingProgressFill {
                animation: none;
                width: 100%;
                opacity: 0.5;
            }
        }
        noscript {
            position: absolute;
            inset: 0;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #0f0f0f;
            color: #fff;
            font-family: system-ui, sans-serif;
            text-align: center;
        }

        // Converts the redirect query string produced by 404.html back into a real path.
        (function(l) {
          if (l.search[1] === '/' ) {
            var decoded = l.search.slice(1).split('&').map(function(s) {
              return s.replace(/~and~/g, '&')
            }).join('?');
            window.history.replaceState(null, null,
                l.pathname.slice(0, -1) + decoded + l.hash
            );
          }
        }(window.location))

    <!-- The URLs and uncompressed sizes of the wasm binaries, filled in by the compressWebDistribution Gradle task. -->
    <script type="text/javascript">window.__WASM_ASSETS__ = [{"url":"bfa5198fb2fe683c613a.wasm","bytes":8640316},{"url":"4cfc7f15aa7b1e72c0b3.wasm","bytes":5566100}];</script>
    <script type="text/javascript">
        // The wasm binaries are by far the largest thing the page downloads, and app.js only asks
        // for them once it has been fetched and run. Starting them here, while the document is still
        // being parsed, removes that gap; the in-flight responses are handed to app.js when it asks
        // for the same URLs, so nothing is downloaded twice.
        //
        // Reading a clone of each response also gives us real byte counts, which drive the progress
        // bar. The counts are of decompressed bytes, so they are compared against the uncompressed
        // sizes recorded at build time rather than against Content-Length (which is the brotli size).
        (function () {
          var assets = window.__WASM_ASSETS__ || [];
          var origFetch = window.fetch ? window.fetch.bind(window) : null;
          var DOWNLOAD_SHARE = 0.85;   // The remainder is left for compiling and starting up.
          var COMPILE_TARGET = 0.97;
          var COMPILE_EASE_MS = 4000;

          var expected = 0;
          var received = 0;
          var outstanding = 0;
          var progress = 0;
          var compileStartedAt = 0;
          var frame = 0;

          function element(id) {
            return document.getElementById(id);
          }

          function render() {
            frame = 0;
            var bar = element('loadingProgress');
            var fill = element('loadingProgressFill');
            if (!bar || !fill) {
              schedule();
              return;
            }
            var value = progress;
            if (compileStartedAt) {
              var eased = Math.min(1, (Date.now() - compileStartedAt) / COMPILE_EASE_MS);
              value = Math.max(value, DOWNLOAD_SHARE + (COMPILE_TARGET - DOWNLOAD_SHARE) * eased);
            }
            bar.classList.remove('indeterminate');
            fill.style.width = (value * 100).toFixed(1) + '%';
            bar.setAttribute('aria-valuenow', Math.round(value * 100));
            if (value < COMPILE_TARGET) {
              schedule();
            }
          }

          function schedule() {
            if (!frame) {
              frame = requestAnimationFrame(render);
            }
          }

          function count(response) {
            var body = response.body;
            if (!body || !body.getReader) {
              return;
            }
            var reader = body.getReader();
            function step(result) {
              if (result.done) {
                outstanding--;
                if (outstanding === 0 && !compileStartedAt) {
                  compileStartedAt = Date.now();
                  schedule();
                }
                return;
              }
              received += result.value.length;
              progress = Math.min(1, received / expected) * DOWNLOAD_SHARE;
              schedule();
              return reader.read().then(step);
            }
            reader.read().then(step, function () { outstanding--; });
          }

          // Fills the bar the moment the app takes over, so it never sits at 97% behind the fade-out.
          function watchForHandover() {
            var screen = element('loadingScreen');
            if (!screen || !window.MutationObserver) {
              return;
            }
            var observer = new MutationObserver(function () {
              if (screen.classList.contains('hidden')) {
                progress = 1;
                compileStartedAt = 0;
                observer.disconnect();
                schedule();
              }
            });
            observer.observe(screen, { attributes: true, attributeFilter: ['class'] });
          }

          document.addEventListener('DOMContentLoaded', function () {
            watchForHandover();
            if (!expected) {
              var bar = element('loadingProgress');
              if (bar) {
                bar.classList.add('indeterminate');
              }
            }
          });

          if (!origFetch || !assets.length) {
            return;
          }

          var pending = Object.create(null);
          assets.forEach(function (asset) {
            var url;
            try {
              url = new URL(asset.url, document.baseURI).href;
            } catch (error) {
              return;
            }
            expected += asset.bytes || 0;
            outstanding++;
            var request = origFetch(url, { credentials: 'same-origin' });
            pending[url] = request;
            request.then(function (response) {
              if (!response || !response.ok) {
                outstanding--;
                return;
              }
              try {
                count(response.clone());
              } catch (error) {
                outstanding--;
              }
            }, function () {
              outstanding--;
            });
          });

          if (!expected) {
            return;
          }
          schedule();

          window.fetch = function (input, init) {
            var url = '';
            try {
              url = new URL(typeof input === 'string' ? input : (input && input.url) || '', document.baseURI).href;
            } catch (error) {
              url = '';
            }
            var prefetched = pending[url];
            if (prefetched) {
              // Handed out once: a retry has to go to the network, the body is already consumed.
              delete pending[url];
              return prefetched;
            }
            return origFetch.apply(null, arguments);
          };
        }());
    </script>
