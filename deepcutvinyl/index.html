            var link = document.createElement('link');
            link.rel = 'preload';
            link.as = 'fetch';
            link.crossOrigin = 'anonymous';
            link.setAttribute('fetchpriority', 'low');
            link.href = 'composeResources/deepcutvinyl.app.generated.resources/drawable/img_home_01.webp';
            document.head.appendChild(link);
          } catch (error) {

        }());

            width: 0;
            height: 100%;
            border-radius: 999px;
            background: #ad92f0;
            transform-origin: left center;
            transition: width 0.25s ease-out;
        }
        /* Used when the download size is unknown, so the bar still shows that work is happening. */
        #loadingProgress.indeterminate #loadingProgressFill {
            width: 40%;
            transition: none;
            animation: slide 1.1s ease-in-out infinite;
        }
        @keyframes slide {
            0% { transform: translateX(-100%); }

    <!-- The URLs and uncompressed sizes of the wasm binaries, filled in by the compressWebDistribution Gradle task. -->
    <script type="text/javascript">window.__WASM_ASSETS__ = [{"url":"bfa5198fb2fe683c613a.wasm","bytes":8640316},{"url":"3a71e27b31945372ce37.wasm","bytes":5886777}];</script>
    <script type="text/javascript">
        // The wasm binaries are by far the largest thing the page downloads, and app.js only asks
        // for them once it has been fetched and run. Starting them here, while the document is still
        // being parsed, removes that gap; the in-flight responses are handed to app.js when it asks
        // for the same URLs, so nothing is downloaded twice.
        //
        // Reading a clone of each response also gives us real byte counts, which drive the progress
        // bar. The counts are of decompressed bytes, so they are compared against the uncompressed
        // sizes recorded at build time rather than against Content-Length (which is the brotli size).
        //
        // configuration.json is started here too: it decides the menu and whether ordering is possible,
        // and this way it has usually arrived by the time the app first asks for it.
        (function () {
          var assets = window.__WASM_ASSETS__ || [];
          var origFetch = window.fetch ? window.fetch.bind(window) : null;
          var DOWNLOAD_SHARE = 0.85;   // The remainder is left for compiling and starting up.
          var COMPILE_TARGET = 0.97;
          var COMPILE_EASE_MS = 4000;

          var expected = 0;
          var received = 0;
          var outstanding = 0;
          var progress = 0;
          var compileStartedAt = 0;
          var frame = 0;

          function element(id) {
            return document.getElementById(id);
          }

          function render() {
            frame = 0;
            var bar = element('loadingProgress');
            var fill = element('loadingProgressFill');
            if (!bar || !fill) {
              schedule();
              return;
            }
            var value = progress;
            if (compileStartedAt) {
              var eased = Math.min(1, (Date.now() - compileStartedAt) / COMPILE_EASE_MS);
              value = Math.max(value, DOWNLOAD_SHARE + (COMPILE_TARGET - DOWNLOAD_SHARE) * eased);
            }
            bar.classList.remove('indeterminate');
            fill.style.width = (value * 100).toFixed(1) + '%';
            bar.setAttribute('aria-valuenow', Math.round(value * 100));
            if (value < COMPILE_TARGET) {
              schedule();
            }
          }

          function schedule() {
            if (!frame) {
              frame = requestAnimationFrame(render);
            }
          }

          // A download that ends, fails or cannot be counted no longer holds back the compile phase.
          function finished() {
            outstanding--;
            if (outstanding === 0 && !compileStartedAt) {
              compileStartedAt = Date.now();
              schedule();
            }
          }

          function count(response) {
            var body = response.body;
            if (!body || !body.getReader) {
              finished();
              return;
            }
            var reader = body.getReader();
            function step(result) {
              if (result.done) {
                finished();
                return;
              }
              received += result.value.length;
              progress = Math.min(1, received / expected) * DOWNLOAD_SHARE;
              schedule();
              return reader.read().then(step, finished);
            }
            reader.read().then(step, finished);
          }

          // Fills the bar the moment the app takes over, so it never sits at 97% behind the fade-out.
          function watchForHandover() {
            var screen = element('loadingScreen');
            if (!screen || !window.MutationObserver) {
              return;
            }
            var observer = new MutationObserver(function () {
              if (screen.classList.contains('hidden')) {
                progress = 1;
                compileStartedAt = 0;
                observer.disconnect();
                schedule();
              }
            });
            observer.observe(screen, { attributes: true, attributeFilter: ['class'] });
          }

          document.addEventListener('DOMContentLoaded', function () {
            watchForHandover();
            if (!expected) {
              var bar = element('loadingProgress');
              if (bar) {
                bar.classList.add('indeterminate');
              }
            }
          });

          if (!origFetch) {
            return;
          }

          var configurationUrl = null;
          var configuration = null;
          try {
            configurationUrl = new URL('configuration.json', document.baseURI);
            // Its own cache buster: the file is replaced by hand on the server and must never be stale.
            configuration = origFetch(configurationUrl.href + '?v=' + Math.random().toString(36).slice(2), {
              credentials: 'same-origin',
              cache: 'no-store'
            });
            configuration.catch(function () {});
          } catch (error) {
            configuration = null;
          }

          var pending = Object.create(null);
          assets.forEach(function (asset) {
            var url;
            try {
              url = new URL(asset.url, document.baseURI).href;
            } catch (error) {
              return;
            }
            expected += asset.bytes || 0;
            outstanding++;
            var request = origFetch(url, { credentials: 'same-origin' });
            pending[url] = request;
            request.then(function (response) {
              if (!response || !response.ok) {
                finished();
                return;
              }
              try {
                count(response.clone());
              } catch (error) {
                finished();
              }
            }, function () {
              finished();
            });
          });

          if (expected) {
            schedule();
          }

          window.fetch = function (input, init) {
            var url = null;
            try {
              url = new URL(typeof input === 'string' ? input : (input && input.url) || '', document.baseURI);
            } catch (error) {
              url = null;
            }
            var prefetched = url && pending[url.href];
            if (prefetched) {
              // Handed out once: a retry has to go to the network, the body is already consumed.
              delete pending[url.href];
              return prefetched;
            }
            // The app adds a cache buster of its own, so the configuration is matched without the query.
            if (url && configuration && url.origin === configurationUrl.origin && url.pathname === configurationUrl.pathname) {
              var early = configuration;
              var args = arguments;
              configuration = null;
              // A failed early request is repeated as the app's own instead of failing it.
              return early.catch(function () {
                return origFetch.apply(null, args);
              });
            }
            return origFetch.apply(null, arguments);
          };
        }());

    <script type="text/javascript">
        // Browsers without WebAssembly garbage collection (such as Safari before 18.2) cannot start the app
        // and would otherwise show the loading bar forever. The bytes are an empty module with one struct type.
        (function () {
          var isSupported = false;
          try {
            isSupported = typeof WebAssembly === 'object' &&
              WebAssembly.validate(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 3, 1, 95, 0]));
          } catch (error) {
          }
          if (!isSupported) {
            var screen = document.getElementById('loadingScreen');
            var progress = document.getElementById('loadingProgress');
            if (progress) {
              progress.remove();
            }
            if (screen) {
              screen.removeAttribute('aria-busy');
              var message = document.createElement('p');
              message.className = 'unsupported';
              message.textContent = 'This browser is too old to show the DeepCut Vinyl website. Please update it, or write to contact@deepcutvinyl.com or call +40 740 755 264.';
              screen.appendChild(message);
            }
          }
        }());
    </script>
