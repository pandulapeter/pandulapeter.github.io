        // https://github.com/rafgraph/spa-github-pages
        // This script checks to see if a redirect is present in the query string,
        // converts it back into the correct url and adds it to the
        // browser's history using window.history.replaceState(...),
        // which won't cause the browser to attempt to load the new url.
        // When the single page app is loaded further down in this file,
        // the correct url will be waiting in the browser's history for
        // the single page app to route accordingly.
        (function(l) {
          if (l.search[1] === '/' ) {
            var decoded = l.search.slice(1).split('&').map(function(s) {
              return s.replace(/~and~/g, '&')
            }).join('?');
            window.history.replaceState(null, null,
                l.pathname.slice(0, -1) + decoded + l.hash
            );
          }
        }(window.location))

<script type="text/javascript">
    // Reports download progress for the resources the app fetches before its first frame, then hands the page
    // over to the app. The production build injects the uncompressed size of every such resource as
    // `kubrikoResourceSizes`; the sizes cannot come from the responses because the server compresses them.
    // Every tracked fetch is wrapped in a stream that counts the bytes as they arrive, which keeps the wasm
    // binaries on the streaming compilation path.
    (function () {
        const loadingScreen = document.getElementById('loadingScreen');
        const progressBar = document.getElementById('loadingProgress');
        const progressFill = progressBar.firstElementChild;
        const originalFetch = window.fetch;
        const expectedSizes = new Map();
        const receivedSizes = new Map();
        let expectedTotal = 0;
        let receivedTotal = 0;
        let completedCount = 0;
        const resolve = (input) => new URL(input instanceof Request ? input.url : String(input), document.baseURI).href;
        const report = (url, receivedBytes) => {
            const expectedBytes = expectedSizes.get(url);
            const previousBytes = receivedSizes.get(url) || 0;
            const currentBytes = Math.min(receivedBytes, expectedBytes);
            receivedSizes.set(url, currentBytes);
            receivedTotal += currentBytes - previousBytes;
            progressFill.style.width = (100 * receivedTotal / expectedTotal) + '%';
            if (receivedBytes >= expectedBytes && previousBytes < expectedBytes && ++completedCount === expectedSizes.size) {
                stopTracking();
                progressBar.classList.add('complete');
            }
        };
        const stopTracking = () => {
            if (window.fetch === trackingFetch) {
                window.fetch = originalFetch;
            }
        };
        const trackingFetch = function (input, init) {
            const url = resolve(input);
            if (!expectedSizes.has(url)) {
                return originalFetch.call(window, input, init);
            }
            return originalFetch.call(window, input, init).then((response) => {
                if (!response.ok || !response.body) {
                    return response;
                }
                let receivedBytes = 0;
                const counter = new TransformStream({
                    transform(chunk, controller) {
                        receivedBytes += chunk.byteLength;
                        report(url, receivedBytes);
                        controller.enqueue(chunk);
                    },
                    flush() {
                        report(url, expectedSizes.get(url));
                    },
                });
                return new Response(response.body.pipeThrough(counter), {
                    status: response.status,
                    statusText: response.statusText,
                    headers: response.headers,
                });
            });
        };
        window.hideLoadingScreen = () => {
            stopTracking();
            loadingScreen.classList.add('hidden');
            loadingScreen.addEventListener('transitionend', () => loadingScreen.remove(), { once: true });
        };
        const sizes = window.kubrikoResourceSizes;
        if (!sizes || typeof TransformStream === 'undefined') {
            return;
        }
        for (const path in sizes) {
            expectedSizes.set(resolve(path), sizes[path]);
            expectedTotal += sizes[path];
        }
        if (expectedTotal > 0) {
            window.fetch = trackingFetch;
            progressBar.classList.add('tracking');
        }
    })();
</script>
